name: "Upstream Sync Check"

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  check-upstream:
    name: Check for upstream updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch full history
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: Add upstream remote
      run: |
        git remote add upstream https://github.com/sttp/cppapi.git || true
        git remote -v
        
    - name: Fetch upstream changes
      run: |
        git fetch upstream
        
    - name: Check for upstream updates
      id: check
      run: |
        # Get the latest commit from upstream main branch
        UPSTREAM_COMMIT=$(git rev-parse upstream/main)
        echo "Upstream latest commit: $UPSTREAM_COMMIT"
        
        # Get the latest commit from our main branch (or current branch if no main)
        if git show-ref --verify --quiet refs/heads/main; then
          LOCAL_COMMIT=$(git rev-parse main)
          BRANCH_NAME="main"
        else
          LOCAL_COMMIT=$(git rev-parse HEAD)
          BRANCH_NAME=$(git branch --show-current)
        fi
        echo "Local latest commit: $LOCAL_COMMIT"
        echo "Current branch: $BRANCH_NAME"
        
        # Check if there are new commits in upstream
        if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
          echo "updates_available=true" >> $GITHUB_OUTPUT
          
          # Count commits behind
          COMMITS_BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "unknown")
          echo "commits_behind=$COMMITS_BEHIND" >> $GITHUB_OUTPUT
          
          # Get summary of changes
          echo "Getting change summary..."
          CHANGES_SUMMARY=$(git log --oneline HEAD..upstream/main --max-count=10 2>/dev/null || echo "Could not determine changes")
          echo "changes_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Updates available from upstream!"
        else
          echo "updates_available=false" >> $GITHUB_OUTPUT
          echo "✅ Repository is up to date with upstream"
        fi
        
    - name: Create issue for upstream updates
      if: steps.check.outputs.updates_available == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const commitsBehind = '${{ steps.check.outputs.commits_behind }}';
          const changesSummary = `${{ steps.check.outputs.changes_summary }}`;
          
          // Check if there's already an open issue about upstream updates
          const existingIssues = await github.rest.issues.listForRepo({
            owner: owner,
            repo: repo,
            state: 'open',
            labels: 'upstream-sync'
          });
          
          const updateBody = `## 🔄 Upstream Update Check - ${new Date().toISOString().split('T')[0]}

          Status: New updates available from upstream repository
          Commits behind: ${commitsBehind}

          ### Recent changes in upstream:
          \`\`\`
          ${changesSummary}
          \`\`\`

          Action needed: Review and merge the upstream changes when appropriate.

          This comment was automatically generated by the upstream sync check workflow.`;

          const issueBody = `## Upstream Repository Updates Available

          The upstream repository \`sttp/cppapi\` has new commits that are not present in this fork.

          Commits behind: ${commitsBehind}

          ### Recent changes in upstream:
          \`\`\`
          ${changesSummary}
          \`\`\`

          ### Recommended Actions:
          1. Review the upstream changes to understand what has been updated
          2. Consider merging or rebasing the upstream changes
          3. Test the changes to ensure compatibility
          4. Update any fork-specific modifications if needed

          ### How to sync manually:
          \`\`\`bash
          git remote add upstream https://github.com/sttp/cppapi.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          # or alternatively: git rebase upstream/main
          \`\`\`

          This issue was automatically created by the upstream sync check workflow. It runs daily to keep you informed about upstream changes.`;
          
          if (existingIssues.data.length > 0) {
            console.log('An upstream sync issue already exists. Updating the existing issue.');
            const issueNumber = existingIssues.data[0].number;
            
            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: issueNumber,
              body: updateBody
            });
          } else {
            console.log('Creating new upstream sync issue.');
            await github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: '🔄 Upstream updates available',
              body: issueBody,
              labels: ['upstream-sync', 'enhancement']
            });
          }
          
    - name: Report status
      run: |
        if [ "${{ steps.check.outputs.updates_available }}" == "true" ]; then
          echo "🔄 Upstream updates detected and issue created/updated"
        else
          echo "✅ Repository is up to date with upstream"
        fi